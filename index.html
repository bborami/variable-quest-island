:root{--c:#7b5cc7;--d:#6447b0;--h:#efe6ff}
html[data-subject=life]{--c:#3a86c8;--d:#2c6ea8;--h:#e2f3ff}
html[data-subject=nonlife]{--c:#2f9c78;--d:#237e60;--h:#dcf6ec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
 background:linear-gradient(160deg,#fde8f3 0%,var(--h) 55%,#e6f7ee 100%);

.lk{width:100%;max-width:360px;padding:34px 28px 28px;border-radius:32px;background:#fff6fb;text-align:center;

.ic{font-size:46px;line-height:1}
h1{margin:12px 0 6px;font-size:22px;color:var(--c)}
p{margin:0 0 20px;font-size:14px;color:#8a7ba8;line-height:1.5}
input{width:100%;padding:14px 16px;border:0;border-radius:18px;background:#fff;font:inherit;font-size:16px;color:#4a3d6b;outline:none;
 box-shadow:inset 3px 3px 7px rgba(120,90,170,.18),inset -3px -3px 7px #fff}
input:focus{box-shadow:inset 3px 3px 7px rgba(120,90,170,.18),inset -3px -3px 7px #fff,0 0 0 3px var(--h)}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:18px;background:var(--c);color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer;
 box-shadow:inset -3px -4px 0 var(--d),5px 7px 14px rgba(120,90,170,.25)}
button:disabled{opacity:.6;cursor:wait}
.er{min-height:20px;margin-top:12px;font-size:14px;color:#d9665b}
.wait .lk form{display:none}
</style>

  function b(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
  function b64(buf){var u=new Uint8Array(buf),s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
  var S=crypto.subtle;
  function open(raw){

  if(saved){open(b(saved)).then(show,function(){try{localStorage.removeItem(KK)}catch(e){}ask()})}else ask();
